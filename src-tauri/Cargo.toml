[package]
name = "app"
version = "0.1.0"
description = "Easy CD - Albion Cooldown Vision Tracker"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.6", features = [] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.2.0"
device_query = "0.2"
regex = "1.9"
base64 = "0.22"
png = "0.17"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Media_Ocr",
  "Graphics_Imaging",
  "Globalization",
  "Storage_Streams",
  "Security_Cryptography",
]

[profile.release]
strip = true
lto = "thin"
